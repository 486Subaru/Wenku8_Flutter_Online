name: Online APK build and checks

on:
  push:
    branches: ['restore-online-0.5.5', 'riqing-custom-sources']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Point Wenku8 integration at the active website host
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'android/app/src/main/kotlin/org/mewx/wenku8_flutter/Wenku8OfficialWebPlugin.kt': [
                  ('https://www.wenku8.net', 'https://www.wenku8.cc'),
              ],
              'android/app/src/main/kotlin/org/mewx/wenku8_flutter/Wenku8LoginActivity.kt': [
                  ('https://www.wenku8.net', 'https://www.wenku8.cc'),
              ],
              'android/app/src/main/kotlin/org/mewx/wenku8_flutter/Wenku8SessionCookies.kt': [
                  ('https://www.wenku8.net/', 'https://www.wenku8.cc/'),
                  ('Domain=www.wenku8.net', 'Domain=www.wenku8.cc'),
                  ('Domain=wenku8.net', 'Domain=wenku8.cc'),
              ],
              'android/app/src/main/kotlin/org/mewx/wenku8_flutter/Wenku8UrlPolicy.kt': [
                  ('setOf("www.wenku8.net", "wenku8.net")', 'setOf("www.wenku8.cc", "wenku8.cc")'),
              ],
              'lib/wenku8_html_parser.dart': [
                  ("https://www.wenku8.net/", "https://www.wenku8.cc/"),
              ],
              'android/app/src/test/kotlin/org/mewx/wenku8_flutter/Wenku8UrlPolicyTest.kt': [
                  ('www.wenku8.net', 'www.wenku8.cc'),
                  ('://wenku8.net', '://wenku8.cc'),
              ],
          }

          for name, replacements in files.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'Expected Wenku8 host reference was not found in {name}')
              path.write_text(text, encoding='utf-8')
              print(f'Updated {name}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Wenku8-0.5.5-online-arm64-wenku8cc
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
