name: One-time v2285 source migration finalizer
# source-only retry after verified v2285 APK build

on:
  push:
    branches: ['riqing-custom-sources']
    paths: ['.github/workflows/v2285-migrate-build.yml']

permissions:
  contents: write

jobs:
  migrate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: riqing-custom-sources
          fetch-depth: 0

      - name: Land verified v2284 patches and v2285 metadata
        run: |
          python3 tool/apply_v2284_patch.py
          python3 tool/apply_v2284_postpatch.py
          python3 tool/v2285_migrate.py
          git diff --check

      - name: Commit permanent v2285 application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Land verified v2285 application source'
          git push origin HEAD:riqing-custom-sources
