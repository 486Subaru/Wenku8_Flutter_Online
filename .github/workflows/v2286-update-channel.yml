name: One-time v2286 source finalizer

on:
  push:
    branches: ['riqing-custom-sources']
    paths: ['.github/workflows/v2286-update-channel.yml']

permissions:
  contents: write

jobs:
  finalize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: riqing-custom-sources
          fetch-depth: 0

      - name: Apply already-verified v2286 migration
        run: |
          python3 tool/v2286_update_channel.py
          git diff --check

      - name: Commit permanent v2286 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/updates/app_updates.dart lib/updates/current_release_content.dart pubspec.yaml README.md README_ZH.md NOTICE
          git add -f test/app_updates_test.dart
          git commit -m 'Fix Riqing update channel and prepare v2286'
          git push origin HEAD:riqing-custom-sources
