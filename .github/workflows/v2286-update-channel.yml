name: One-time v2286 update channel fix

on:
  push:
    branches: ['riqing-custom-sources']
    paths: ['.github/workflows/v2286-update-channel.yml']

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: riqing-custom-sources
          fetch-depth: 0

      - name: Apply v2286 update-channel migration
        run: |
          python3 tool/v2286_update_channel.py
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Run Android native unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Prepare Riqing release asset
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/release/riqing-0.5.5-arm64-v8a.apk

      - name: Upload v2286 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: riqing-0.5.5-arm64-v2286
          path: build/release/riqing-0.5.5-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit permanent v2286 application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/updates/app_updates.dart lib/updates/current_release_content.dart pubspec.yaml README.md README_ZH.md NOTICE test/app_updates_test.dart
          git commit -m 'Fix Riqing update channel and prepare v2286'
          git push origin HEAD:riqing-custom-sources
