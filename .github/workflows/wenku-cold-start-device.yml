name: Verify the unchanged 日轻 APK on a live Android connection

on:
  push:
    branches: ['verify/wenku8-cold-start-device']

permissions:
  contents: read
  actions: read

jobs:
  live-android:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44080498768
          name: riqing-0.5.5-cold-start-x86_64
          path: build/app/outputs/flutter-apk
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate the genuine install, idle startup and explicit connection
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/wenku_coldstart_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-device-diagnostics
          path: build/wenku-startup-diagnostics
          if-no-files-found: ignore
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test native restart and request pacing
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon
