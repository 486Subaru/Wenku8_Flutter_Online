name: Wenku8 controlled online cold-start APK

on:
  push:
    branches: ['verify/wenku8-cold-start-apk']

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Analyze Dart source and run Flutter tests
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build ARM64 and emulator APKs
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --no-pub
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$apk" > /tmp/wenku-package.txt
          grep -F "package: name='org.mewx.wenku8_flutter.online.riqingpreview'" /tmp/wenku-package.txt
          grep -Fx "application-label:'日轻'" /tmp/wenku-package.txt
          mkdir -p build/imagetest-delivery
          cp "$apk" build/imagetest-delivery/riqing-0.5.5-cold-start-arm64.apk
          sha256sum build/imagetest-delivery/riqing-0.5.5-cold-start-arm64.apk
      - name: Upload the side-by-side ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: riqing-0.5.5-cold-start-arm64
          path: build/imagetest-delivery/riqing-0.5.5-cold-start-arm64.apk
          if-no-files-found: error
      - name: Save emulator APK for repeatable verification
        uses: actions/upload-artifact@v4
        with:
          name: riqing-0.5.5-cold-start-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify online cold start and discovery on Android 14
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/wenku_coldstart_smoke.sh
      - name: Run Android native unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Attach failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-diagnostics
          path: build/wenku-startup-diagnostics
          if-no-files-found: ignore
