name: Wenku8 Android emulator network verification

on:
  push:
    branches: ['verify/wenku8-android-network']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Build the product and diagnostic APKs
        run: |
          flutter pub get
          mkdir -p build/emulator-evidence
          flutter build apk --debug --target-platform android-x64 --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/wenku-product.apk
          flutter build apk --debug --target-platform android-x64 --target tool/wenku_android_network_probe.dart --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/wenku-probe.apk
          sha256sum /tmp/wenku-product.apk /tmp/wenku-probe.apk | tee build/emulator-evidence/apk-sha256.txt
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android product and network probes
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash tool/wenku_android_network_probe.sh
      - name: Publish emulator evidence to Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenku-android-emulator-evidence
          path: build/emulator-evidence
          if-no-files-found: warn
          retention-days: 7
