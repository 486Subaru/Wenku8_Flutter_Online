name: Wenku8 search replay verification

on:
  push:
    branches: ['verify/wenku8-search-replay']

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify search progress, pagination and retry
        run: flutter test --reporter expanded test/wenku_signed_in_search_replay_test.dart
