name: Wenku8 upstream distribution Android verification

on:
  push:
    branches: ['verify/wenku8-upstream-apk']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify the upstream x86_64 APK
        run: |
          mkdir -p build/upstream-evidence
          curl --fail --location --max-time 150 'https://github.com/mikufoxxx/Wenku8_Flutter/releases/download/v0.5.6/wenku8-0.5.6-x86_64.apk' -o /tmp/upstream-wenku8.apk
          echo '0dd2b77bf5d405505fe963485588b90564a16886fba79fe275894d8cb41d5e71  /tmp/upstream-wenku8.apk' | sha256sum --check | tee build/upstream-evidence/checksum.txt
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the upstream distribution and inspect the public UI
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash tool/wenku_upstream_apk_probe.sh
      - name: Publish the upstream evidence to Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenku-upstream-emulator-evidence
          path: build/upstream-evidence
          if-no-files-found: warn
          retention-days: 7
